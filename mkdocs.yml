site_name: SQL y bases de datos · Apuntes
site_description: "Apuntes y ejercicios de SQL: consultas, JOIN, agrupaciones, diseño, transacciones y más, con resultados reales."
site_url: https://apuntes-dam.github.io/sql-apuntes/
repo_url: https://github.com/apuntes-dam/sql-apuntes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=7678d936
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
